AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cost-conscious Amazon OpenSearch Service domain for learning. This is a
  single-node public-access demo, not a production topology.

Parameters:
  DomainName:
    Type: String
    Default: playground-os-managed
    AllowedPattern: '^[a-z][a-z0-9-]{2,27}$'
    ConstraintDescription: Use 3-28 lowercase letters, digits, and hyphens, starting with a letter.
  EngineVersion:
    Type: String
    Default: OpenSearch_2.19
  InstanceType:
    Type: String
    Default: t3.small.search
    AllowedValues:
      - t3.small.search
    Description: The smallest OpenSearch Service instance available for this demo in eu-central-1.
  VolumeSizeGiB:
    Type: Number
    Default: 10
    MinValue: 10
    MaxValue: 100
    Description: Encrypted gp3 EBS storage. 10 GiB is the service minimum for this demo.
  ProducerVpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the generator EC2 security group.
  ProducerSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet for the generator EC2 instance. It needs outbound HTTPS access to GitHub, AWS APIs, and the public demo domain.
  ProducerInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    Description: Smallest general-purpose burstable instance suitable for the Python demo generator.
  GeneratorRepositoryUrl:
    Type: String
    Default: https://github.com/auke-n/playground-opensearch.git
    Description: Public Git repository containing apps/event-generator.
  GeneratorRevision:
    Type: String
    Default: main
    Description: Git branch, tag, or revision checked out during instance bootstrap.

Resources:
  DomainAdminCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Internal master-user credentials for the managed OpenSearch learning domain.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: playground-opensearch
        - Key: ManagedBy
          Value: CloudFormation

  ManagedOpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Ref DomainName
      EngineVersion: !Ref EngineVersion
      ClusterConfig:
        DedicatedMasterEnabled: false
        InstanceCount: 1
        InstanceType: !Ref InstanceType
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: !Ref VolumeSizeGiB
        VolumeType: gp3
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Sub '{{resolve:secretsmanager:${DomainAdminCredentials}:SecretString:username}}'
          MasterUserPassword: !Sub '{{resolve:secretsmanager:${DomainAdminCredentials}:SecretString:password}}'
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: es:ESHttp*
            Resource: !Sub 'arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${DomainName}/*'
      SoftwareUpdateOptions:
        AutoSoftwareUpdateEnabled: true
      Tags:
        - Key: Name
          Value: !Ref DomainName
        - Key: Project
          Value: playground-opensearch
        - Key: ManagedBy
          Value: CloudFormation

  GeneratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only security group for the OpenSearch demo event generator.
      VpcId: !Ref ProducerVpcId
      SecurityGroupEgress:
        - Description: HTTPS for OpenSearch, Secrets Manager, SSM, and GitHub.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-generator'
        - Key: Project
          Value: playground-opensearch
        - Key: ManagedBy
          Value: CloudFormation

  GeneratorInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDomainAdminCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DomainAdminCredentials
      Tags:
        - Key: Project
          Value: playground-opensearch
        - Key: ManagedBy
          Value: CloudFormation

  GeneratorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref GeneratorInstanceRole

  GeneratorInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref ProducerInstanceType
      IamInstanceProfile: !Ref GeneratorInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref GeneratorSecurityGroup
          SubnetId: !Ref ProducerSubnetId
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-event-generator'
        - Key: Project
          Value: playground-opensearch
        - Key: ManagedBy
          Value: CloudFormation
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y git python3.11
          install -d -o ec2-user -g ec2-user /opt/opensearch-generator
          git clone --depth 1 --branch ${GeneratorRevision} ${GeneratorRepositoryUrl} /opt/opensearch-generator/repository
          chown -R ec2-user:ec2-user /opt/opensearch-generator/repository

          cat > /opt/opensearch-generator/run-generator.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail

          secret_json=$(aws secretsmanager get-secret-value --secret-id '${DomainAdminCredentials}' --region '${AWS::Region}' --query SecretString --output text)
          export OPENSEARCH_USERNAME=$(printf '%s' "$secret_json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["username"])')
          export OPENSEARCH_PASSWORD=$(printf '%s' "$secret_json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["password"])')

          cd /opt/opensearch-generator/repository/apps/event-generator
          exec /usr/bin/python3.11 -m operational_event_generator.cli --endpoint 'https://${ManagedOpenSearchDomain.DomainEndpoint}' --continuous --batch-size 10 --interval-seconds 1
          EOF
          chmod 0755 /opt/opensearch-generator/run-generator.sh

          cat > /etc/systemd/system/opensearch-event-generator.service <<'EOF'
          [Unit]
          Description=OpenSearch demo operational event generator
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/opensearch-generator/repository/apps/event-generator
          ExecStart=/opt/opensearch-generator/run-generator.sh
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now opensearch-event-generator.service

Outputs:
  DomainEndpoint:
    Description: HTTPS endpoint for the managed OpenSearch REST API.
    Value: !GetAtt ManagedOpenSearchDomain.DomainEndpoint
  DashboardsUrl:
    Description: Managed OpenSearch Dashboards URL. Sign in with the generated internal admin credentials.
    Value: !Sub 'https://${ManagedOpenSearchDomain.DomainEndpoint}/_dashboards/'
  AdminCredentialsSecretArn:
    Description: Secrets Manager ARN holding the OpenSearch internal admin username and password.
    Value: !Ref DomainAdminCredentials
  GeneratorInstanceId:
    Description: EC2 instance that continuously sends demo events to the managed domain.
    Value: !Ref GeneratorInstance
  GeneratorSsmStartSessionCommand:
    Description: Start an SSM shell session to inspect the generator without opening SSH.
    Value: !Sub 'aws ssm start-session --target ${GeneratorInstance} --region ${AWS::Region}'
